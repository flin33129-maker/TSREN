  <rect width="512" height="512" rx="112" fill="#061019"/>
  <!-- NAS 机箱轮廓（荧光青线条） -->
  <rect x="118" y="118" width="276" height="276" rx="30" fill="none" stroke="#35e0d6" stroke-width="18"/>
