<!doctype html>
<!-- 站点入口：R15 主界面构建产物。源文件在 public/app/index.html，构建后本文件由部署脚本同步生成（相对资源已改为 /app/assets 绝对路径）。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="深空工作站 R15：统一设计系统 · 文件 · 办公协同 · AI 助手 · 连接服务 · 数据与安全 · 游戏中心" />
    <title>深空工作站</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2313151b'/%3E%3Cpath d='m20 7 12 7-12 7-12-7zm-12 12 12 7 12-7v5l-12 7-12-7z' fill='%23ad98fa'/%3E%3C/svg%3E" />
    <script>
      /* 首帧前定主题：在 CSS 加载前就把 data-theme/data-density 写到 <html>，
         否则浏览器会先用默认（浅色）绘制一帧再切到暗色 —— 那就是用户抱怨的"闪白"。
         这段必须内联、必须极短，且失败要静默降级。 */
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('r15.theme.v1') || '{}');
          var mode = s.mode || 'dark';
          var resolved = mode;
          if (mode === 'auto') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          var d = document.documentElement;
          d.dataset.theme = resolved;
          d.dataset.density = s.density === 'compact' ? 'compact' : 'comfortable';
          d.style.setProperty('--accent-h', String(typeof s.hue === 'number' ? s.hue : 262));
          d.style.setProperty('--accent-s', (typeof s.sat === 'number' ? s.sat : 78) + '%');
          d.style.colorScheme = resolved === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      /* 首屏骨架：JS 下载/解析期间给出与主题一致的背景，避免白屏 */
      html, body { margin: 0; height: 100%; background: light-dark(#f5f6f8, #12151b); }
      #root { height: 100%; }
      .boot-splash { height: 100%; display: grid; place-items: center; color: light-dark(#525a68, #a9b3c1); font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
      .boot-splash .b { width: 26px; height: 26px; border-radius: 8px; margin: 0 auto 10px; background: linear-gradient(140deg, #8b6cf0, #6d4fd8); animation: bp 1.1s ease-in-out infinite; }
      @keyframes bp { 0%, 100% { opacity: .45; transform: scale(.92); } 50% { opacity: 1; transform: scale(1); } }
    </style>
    <script type="module" crossorigin src="/app/assets/index--2yckYOw.js"></script>
    <link rel="stylesheet" crossorigin href="/app/assets/index-BASSaKTj.css">
  </head>
  <body>
    <div id="root"><div class="boot-splash"><div><div class="b"></div>正在载入深空工作站…</div></div></div>
  </body>
</html>
