<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>综合检测试验室平面布置图 · 查看</title>
<style>
  :root{
    --bg:#0f172a; --panel:#111c33; --ink:#e7eefb; --muted:#93a4c4;
    --line:#27406b; --accent:#4ea1ff; --accent2:#37d399;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100dvh;width:100%}
  header{
    display:flex;align-items:center;gap:8px;padding:8px 10px;
    background:linear-gradient(180deg,#16243f,#101b30);border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  header h1{font-size:14px;margin:0;font-weight:700;letter-spacing:.5px;flex:1 1 auto;min-width:140px}
  header .sub{font-size:11px;color:var(--muted);font-weight:400}
  .btn{
    background:#1c2c4a;border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:7px 10px;font-size:13px;cursor:pointer;min-width:38px;min-height:38px;
    display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation;
  }
  .btn:active{background:#26406e}
  .zoom{display:flex;gap:6px;align-items:center}
  .viewer{flex:1;position:relative;overflow:hidden;background:#0b1322;touch-action:none}
  .stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #planSvg{display:block;width:1290px;height:1000px;max-width:none}
  .devHit{cursor:pointer}
  .devHit:hover{filter:drop-shadow(0 0 6px var(--accent))}
  .devHit.active .devBox{stroke:var(--accent2)!important;stroke-width:3px!important}
  .devBox{pointer-events:none}
  .panel{
    position:absolute;top:0;right:0;height:100%;width:300px;max-width:86vw;
    background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;z-index:5;
    box-shadow:-8px 0 24px rgba(0,0,0,.4);
  }
  .panel.open{transform:translateX(0)}
  .panel .bar{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;
    justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);z-index:2}
  .panel h2{font-size:13px;margin:0}
  .dev{padding:10px 12px;border-bottom:1px solid #1b2c49;cursor:pointer}
  .dev:active{background:#15243f}
  .dev .name{font-size:13px;font-weight:600}
  .dev .tag{font-size:11px;color:var(--accent);margin-left:6px}
  .dev .desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
  .dev .specs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .dev .spec{font-size:10px;background:#16243f;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:#bcd0f0}
  .area-group{font-size:11px;color:var(--muted);padding:8px 12px 2px;font-weight:700;letter-spacing:1px}
  .hint{position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--muted);
    background:rgba(10,18,33,.7);padding:5px 9px;border-radius:8px;pointer-events:none;max-width:60vw}
  @media (max-width:520px){
    .panel{width:100%;max-width:100%;top:auto;bottom:0;height:62%;border-left:none;border-top:1px solid var(--line);
      transform:translateY(100%);border-radius:14px 14px 0 0}
    .panel.open{transform:translateY(0)}
  }
</style>
</head>

<script>
(function(){
  var cfg = JSON.parse(document.getElementById("cfg").textContent);
  var viewer = document.getElementById("viewer");
  var stage = document.getElementById("stage");
  var svg = document.getElementById("planSvg");
  var SCALE = 50;
  var tx=0, ty=0, sc=1, vw=0, vh=0;

  function fit(){
    vw = viewer.clientWidth; vh = viewer.clientHeight;
    var s = Math.min(vw/1290, vh/1000);
    sc = s; tx = (vw - 1290*s)/2; ty = (vh - 1000*s)/2; apply();
  }
  function apply(){ stage.style.transform = "translate("+tx+"px,"+ty+"px) scale("+sc+")"; }
  function zoomAt(cx, cy, factor){
    var ns = Math.max(0.15, Math.min(6, sc*factor));
    tx = cx - (cx - tx) * (ns/sc);
    ty = cy - (cy - ty) * (ns/sc);
    sc = ns; apply();
  }
  function dist2(){ var a=[].slice.call(pointers.values()); return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); }
  function mid2(){ var a=[].slice.call(pointers.values()); return {x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2}; }

  var dragging=false, lx=0, ly=0, pointers=new Map(), pinchDist=0;
  viewer.addEventListener("pointerdown", function(e){
    viewer.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===1){ dragging=true; lx=e.clientX; ly=e.clientY; }
    else if(pointers.size===2){ dragging=false; pinchDist=dist2(); }
  });
  viewer.addEventListener("pointermove", function(e){
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===2){
      var d=dist2();
      if(pinchDist>0){ var r=d/pinchDist; var mid=mid2(); var rb=viewer.getBoundingClientRect();
        zoomAt(mid.x-rb.left, mid.y-rb.top, r); }
      pinchDist=d; return;
    }
    if(dragging){ tx += e.clientX-lx; ty += e.clientY-ly; lx=e.clientX; ly=e.clientY; apply(); }
  });
  function endP(e){ pointers.delete(e.pointerId); if(pointers.size<2) pinchDist=0; if(pointers.size===0) dragging=false; }
  viewer.addEventListener("pointerup", endP);
  viewer.addEventListener("pointercancel", endP);
  viewer.addEventListener("wheel", function(e){
    e.preventDefault();
    var r=viewer.getBoundingClientRect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.1:0.9);
  }, {passive:false});

  var list = document.getElementById("devList");
  var groups = {};
  cfg.nodes.forEach(function(n){ (groups[n.areaId]=groups[n.areaId]||[]).push(n); });
  Object.keys(groups).forEach(function(aid){
    var g=document.createElement("div"); g.className="area-group";
    var area = cfg.areas.filter(function(a){return a.id===aid;})[0];
    g.textContent = area ? area.name : aid;
    list.appendChild(g);
    groups[aid].forEach(function(n){
      var d=document.createElement("div"); d.className="dev"; d.dataset.id=n.id;
      var specs=(n.specs||[]).map(function(s){return '<span class="spec">'+s.name+' '+s.value+'</span>';}).join("");
      var html = '<div class="name">'+n.label+'<span class="tag">'+(n.kind||"")+'</span></div>';
      if(n.desc) html += '<div class="desc">'+n.desc+'</div>';
      if(specs) html += '<div class="specs">'+specs+'</div>';
      d.innerHTML = html;
      d.addEventListener("click", function(){ focusNode(n.id); });
      list.appendChild(d);
    });
  });

  var hits={};
  Array.prototype.forEach.call(svg.querySelectorAll('g[style*="cursor: pointer"]'), function(g){
    var rect=g.querySelector("rect"); if(!rect) return;
    var rx=parseFloat(rect.getAttribute("x")), ry=parseFloat(rect.getAttribute("y"));
    var node=cfg.nodes.filter(function(n){
      return Math.abs(n.x*SCALE - rx)<1.5 && Math.abs(n.y*SCALE - ry)<1.5;
    })[0];
    if(node){
      g.classList.add("devHit"); g.dataset.id=node.id; hits[node.id]=g;
      var box=rect.cloneNode(false); box.setAttribute("class","devBox");
      g.insertBefore(box, g.firstChild);
      g.addEventListener("click", function(e){ e.stopPropagation(); focusNode(node.id); });
    }
  });

  function focusNode(id){
    var n=cfg.nodes.filter(function(x){return x.id===id;})[0]; if(!n) return;
    var sx=n.x*SCALE, sy=n.y*SCALE, sw=n.w*SCALE, sh=n.h*SCALE;
    var cx=sx+sw/2, cy=sy+sh/2;
    var s=Math.min(vw/(sw*1.8), vh/(sh*1.8)); s=Math.max(0.3, Math.min(4, s));
    sc=s; tx = vw/2 - cx*s; ty = vh/2 - cy*s; apply();
    Object.keys(hits).forEach(function(k){ hits[k].classList.remove("active"); });
    if(hits[id]) hits[id].classList.add("active");
  }

  var panel=document.getElementById("panel"), open=false;
  function openPanel(v){ open=(v===undefined)?!open:v; panel.classList.toggle("open", open); }
  document.getElementById("toggleList").addEventListener("click", function(){ openPanel(true); });
  document.getElementById("closeList").addEventListener("click", function(){ openPanel(false); });
  document.getElementById("zoomIn").addEventListener("click", function(){ zoomAt(vw/2, vh/2, 1.2); });
  document.getElementById("zoomOut").addEventListener("click", function(){ zoomAt(vw/2, vh/2, 0.83); });
  document.getElementById("zoomReset").addEventListener("click", fit);
  window.addEventListener("resize", fit);
  fit();
})();
</script>
