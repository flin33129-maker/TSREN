# R11：SMB 账号管理所需的 capability
#
# 背景：原单元只有 CapabilityBoundingSet=CAP_NET_BIND_SERVICE，结果是
#   · `sudo useradd` → Rust 版 shadow-utils 在恢复 uid 时 PermissionDenied，
#     直接 panic（could not restore to saved user id）
#   · 写 /etc/samba 下的共享配置同样受限（缺 CAP_DAC_OVERRIDE）
# 而本服务已经配了 `tokenllm ALL=(ALL) NOPASSWD:ALL` —— 它随时能 sudo 任何命令，
# 这个 bounding set 提供不了真实隔离，只会把"注册账户自动开通 SMB"这条路弄坏。
#
# 安装：
#   sudo cp ops/systemd/station-caps.conf /etc/systemd/system/station.service.d/caps.conf
#   sudo systemctl daemon-reload && sudo systemctl restart station
[Service]
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_SETUID CAP_SETGID CAP_SETFCAP CAP_MKNOD CAP_AUDIT_WRITE
